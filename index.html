<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendo Studio | Bold Designs for Every Niche</title>
<meta name="description" content="Funny, bold t-shirt designs for dog moms, nurses, teachers and seasonal lovers. French Bulldog Halloween, Christmas and more. New drops weekly.">
<meta property="og:title" content="Rendo Studio | Bold Designs for Every Niche">
<meta property="og:description" content="Funny, bold t-shirt designs for dog moms, nurses, teachers and seasonal lovers. New drops weekly.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#16181d">
<style>
  :root{--bg:#16181d;--ink:#ffffff;--muted:#a9aeb8;--accent:#7c5cff;--line:#2a2d35;--shelf-h:330px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:36px 18px 28px;text-align:center}
  .brand{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h1{font-size:clamp(28px,7vw,44px);line-height:1.1;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 auto 24px;max-width:46ch;font-size:16px}
  .shelf{margin:0 auto 22px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);height:var(--shelf-h)}
  .shelf iframe{display:block;width:100%;height:var(--shelf-h);border:none}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px}
  .btn:active{transform:scale(.98)}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 0}
  .pills span{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 18px 34px}
</style>
</head>
<body>
  <main class="wrap">
    <p class="brand">Rendo Studio</p>
    <h1>Bold designs for every niche</h1>
    <p class="sub">Funny, original t-shirt designs for dog moms, nurses, teachers and seasonal lovers. New drops weekly.</p>

    <div class="shelf">
      <iframe src="https://rendo.store/embed/v1/carousel?wmode=opaque" width="100%" height="330" style="border:none;" title="Rendo Studio merch" loading="lazy"></iframe>
    </div>

    <a class="btn" href="https://rendo.store" target="_blank" rel="noopener">Shop all designs</a>

    <div class="pills">
      <span>French Bulldog</span>
      <span>Halloween</span>
      <span>Christmas</span>
      <span>Nurse life</span>
      <span>Dog mom</span>
    </div>
  </main>
  <footer>&copy; Rendo Studio</footer>
</body>
</html>
